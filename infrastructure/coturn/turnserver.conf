# Minimal coturn config for local testing behind `network_mode: host`.
# For production: run on a public VM, open 3478/tcp+udp, 49152-65535/udp,
# and set real long-term credentials (see README → TURN).
listening-port=3478
fingerprint
lt-cred-mech
realm=randomlive.local
user=randomlive:randomlive
min-port=49152
max-port=65535
# Log to stdout for docker logs
no-cli
